# The dsh-omniroute bundle patch: applied automatically when a profile lists
# this bundle (`dsh plugin add`/`update` appends the package to
# dsh.profile.bundles). Override the row from the profile's own
# cordis.patch.yml with a `- id: omniroute` row, which replaces the row's whole
# `config`.
# Do not also insert this same row into the profile patch: insert does not
# dedupe ids, and a second row would register the plugin twice.
- insert:
    - id: omniroute
      name: 'dsh-omniroute'
